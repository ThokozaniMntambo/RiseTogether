<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/risetogether.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RiseTogether: a career readiness space for South African students and graduates." />
    <meta name="theme-color" content="#2563EB" />
    <script>
      // Apply the saved preference before the first paint. New visitors stay in light mode.
      try {
        if (localStorage.getItem('risetogether-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0B1736';
        }
      } catch { /* Storage may be unavailable; retain the light theme. */ }
    </script>
    <style>html[data-theme="dark"]{background:#0B1736;color:#F8FAFC}</style>
    <title>RiseTogether — Your next chapter starts here</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
